services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: pycon_portugal_2027_local_django
    container_name: pycon_portugal_2027_local_django
    volumes:
      - /app/.venv
      - .:/app:z
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
    ports:
      - '8000:8000'
    command: /start
