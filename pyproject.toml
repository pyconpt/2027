# ==== pytest ====
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--ds=config.settings.test --import-mode=importlib"
python_files = [
    "tests.py",
    "test_*.py",
]
norecursedirs = ["node_modules"]

# ==== Coverage ====
[tool.coverage.run]
include = ["pycon_portugal_2027/**"]
omit = ["*/tests/*"]
plugins = ["django_coverage_plugin"]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
    "mypy_django_plugin.main",
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"

[tool.djlint.css]
indent_size = 2

[tool.djlint.js]
indent_size = 2

[tool.ruff]
line-length = 119
extend-exclude = [
    "staticfiles/*",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "C90",
    "I",
    "N",
    "UP",
    "YTT",
    "ASYNC",
    "S",
    "BLE",
    "FBT",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "DJ",
    "EM",
    "EXE",
    "FA",
    'ISC',
    "ICN",
    "G",
    'INP',
    'PIE',
    "T20",
    'PYI',
    'PT',
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "SIM",
    "TID",
    "TC",
    "INT",
    "PTH",
    "ERA",
    "PD",
    "PGH",
    "PL",
    "TRY",
    "FLY",
    "PERF",
    "RUF",
]
ignore = [
    "S101", # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
    "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
    "SIM102", # sometimes it's better to nest
    "COM812", # trailing commas are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["PLR2004"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pycon_portugal_2027*", "config*"]

[dependency-groups]
dev = [
    "coverage==7.17.2",
    "django-coverage-plugin==3.2.2",
    "django-stubs[compatible-mypy]~=6.1.0",
    "djlint==1.49.9",
    "pytest==9.2.0",
    "pytest-django==4.14.0",
    "ruff==0.17.4",
]

[project]
name = "pycon_portugal_2027"
version = "0.1.0"
description = "PyCon Portugal 2027 website (22-24 April 2027, Leiria)"
readme = "README.md"

license = { text = "Not open source" }
authors = [
  { name = "Isabella Colombarolli", email = "icolombarolli@evolutio.pt" },
]
requires-python = ">=3.12"
dependencies = [
    "django==6.1.3",
    "django-environ==0.14.0",
    "gunicorn==26.2.0",
    "markdown==3.11.3",
    "whitenoise==6.12.0",
]
